# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua


$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$codeEditor = /home/kweber/.local/bin/cursor-gui
#$menu = hyprlauncher

#Hyprswitch
bind = ALT, Tab, exec, hyprswitch gui --mod-key alt_l --key tab --close mod-key-release
bindr = ALT, Alt_L, exec, hyprswitch close

# wofi launcher
bind = $mainMod, R, exec, wofi --show drun --allow-images --insensitive
bind = ALT, space, exec, wofi --show drun --allow-images --insensitive


# Screenshots
bind = , Print, exec, grimblast copy area
bind = SHIFT, Print, exec, grimblast copy screen

# Volume
bind = , XF86AudioRaiseVolume, exec, bash -c 'if wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep -q MUTED; then wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.5; else wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; fi'
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = SHIFT, XF86MonBrightnessUp, exec, brightnessctl set 50%+
bind = SHIFT, XF86MonBrightnessDown, exec, brightnessctl set 50%-


#PlayerCtl
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Clipboard manager
exec-once = wl-paste --watch cliphist store

# Monitor config
monitor = eDP-1,1920x1080@60,0x0,1

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, I, exec, $codeEditor
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
#bind = $mainMod, R, exec, $menu


# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Fullscreen
bind = $mainMod, F, fullscreen,

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = , F1, workspace, 1
bind = , F2, workspace, 2
bind = , F3, workspace, 3
bind = , F4, workspace, 4
bind = , F5, workspace, 5
bind = , F6, workspace, 6
bind = , F7, workspace, 7
bind = , F8, workspace, 8
bind = , F9, workspace, 9


# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Autostart
exec-once = waybar
exec-once = dunst
exec-once = hyprpolkitagent
exec-once = hyprswitch init &
exec-once = libinput-gestures
exec-once = hypridle
exec-once = sudo tlp start
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
exec-once = blueman-applet
exec-once = mako

# Appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

input {
    touchpad {
        natural_scroll = true
        tap-to-click = false
        drag_lock = true
        clickfinger_behavior = true
    }
    sensitivity = 0.7
    follow_mouse = 2
}


